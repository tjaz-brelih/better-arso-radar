<div #map class="h-dvh" [cdkContextMenuTriggerFor]="mapContextMenu" (contextmenu)="$event.preventDefault(); this.contextMenuPosition.set($event);"></div>

<ng-template #mapContextMenu>
    <app-map-context-menu [marker]="this.contextMenuMarker()" [onEdit]="x => this.openMarkerDialog(x)" [onRemove]="x => this.removeMarker(x)" />
</ng-template>



<!-- Map controls -->
<div class="absolute h-full p-4 top-0 left-0 z-500 flex flex-col gap-4 pointer-events-none *:pointer-events-auto">

  <!-- Zoom -->
  <app-button-group>
    <button appIconButton (click)="this.zoom('in')">
      <app-icon icon="plus" />
    </button>

    <button appIconButton (click)="this.zoom('out')">
      <app-icon icon="minus" />
    </button>
  </app-button-group>

  <!-- Geolocation -->
  <button appIconButton (click)="this.setGeolocationMarker()" appTooltip="Add marker at your current location">
    <app-icon icon="map-pin" />
  </button>

  <!-- Refresh -->
  <button appIconButton (click)="this.triggerTimer()" [disabled]="this.isLoading()" appTooltip="Refresh radar images">
    <app-icon icon="arrow-path" [class.animate-(--animation-spin)]="this.isSpinning()" (animationiteration)="this.onSpinIteration()" />
  </button>

  <!-- Settings -->
  <button appIconButton (click)="this.openSettingsDialog()" appTooltip="Settings">
    <app-icon icon="cog" />
  </button>

  <!-- Transparency -->
  <div class="grow max-h-62 min-h-20 py-3 bg-color-background border border-color-border rounded-lg" appTooltip="Radar image opacity">
    <app-slider vertical [(value)]="this.opacity" [max]="1" step="0.01" />
  </div>

</div>


@if (this.currentRadarImage()?.radarImage?.date; as date) {
  <!-- Time information -->
  <div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-56 z-500 text-center bg-color-background border border-t-0 border-color-border rounded-b-lg">
    <div class="py-0.5 font-mono text-xl">
      {{ date | date: 'd.MM.yyyy HH:mm' }}
    </div>
    <div class="w-full py-0.5 text-center text-xs border-t border-color-border">
      Refreshed at <span class="font-mono">{{ this.refreshedAt() | date: 'HH:mm' }}</span>
    </div>
  </div>


  <!-- Slider -->
  <div class="absolute bottom-0 left-1/2 px-4 pt-2 pb-6 w-xl max-w-[80%] transform -translate-x-1/2 z-500 bg-color-background border border-b-0 border-color-border rounded-t-2xl">
    @let images = this.radarImages();
    <app-slider [max]="images.length - 1" [(value)]="this.slider" />
  </div>
}

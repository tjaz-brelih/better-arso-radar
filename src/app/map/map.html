<div #map class="h-dvh" [cdkContextMenuTriggerFor]="contextMenu" (contextmenu)="$event.preventDefault(); this.contextMenuPosition.set($event);"></div>


<!-- Map controls -->
<div class="absolute top-4 left-4 z-500 flex flex-col gap-2">

  <!-- Zoom -->
  <app-button-group>
    <button appButton (click)="this.zoom('in')">
      <app-icon icon="plus" />
    </button>

    <button appButton (click)="this.zoom('out')">
      <app-icon icon="minus" />
    </button>
  </app-button-group>

  <!-- Location -->
  <app-button-group>
    <button appButton (click)="this.setDefaultPosition()" appTooltip="Set default map view">
      <app-icon icon="map-pin" />
    </button>

    <button appButton (click)="this.resetPosition()" appTooltip="Reset map view">
      <app-icon icon="viewfinder-circle" />
    </button>
  </app-button-group>

  <!-- Refresh -->
  <app-button-group>
    <button appButton (click)="this.triggerTimer()" [disabled]="this.isLoading()" appTooltip="Refresh radar images">
      <app-icon icon="arrow-path" />
    </button>
  </app-button-group>

  <!-- Settings -->
  <!-- <app-button-group>
    <button appButton disabled appTooltip="Settings">
      <app-icon icon="cog" />
    </button>
  </app-button-group> -->

</div>


@let date = this.currentRadarImage()?.radarImage?.date;
@if (date) {
  <!-- Time information -->
  <div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-56 z-500 text-center bg-color-background border border-t-0 border-color-border rounded-b-lg">
    <div class="py-0.5 font-mono text-xl">
      {{ date | date: 'd.MM.yyyy HH:mm' }}
    </div>
    <div class="w-full py-0.5 text-center text-xs border-t border-color-border">
      Refreshed at <span class="font-mono">{{ this.refreshedAt() | date: 'HH:mm' }}</span>
    </div>
  </div>


  <!-- Slider -->
  <div class="absolute bottom-0 left-1/2 px-4 pt-2 pb-4 w-xl max-w-full transform -translate-x-1/2 z-500 bg-color-background border border-b-0 border-color-border rounded-t-lg">
    <input type="range" [formField]="this.form.slider" step="1" list="markers" class="w-full not-disabled:cursor-pointer" />

    <datalist id="markers">
      @for (_ of this.radarImages(); track _.radarImage.date) {
        <option [value]="$index"></option>
      }
    </datalist>
  </div>
}



<ng-template #contextMenu>
  <div class="min-w-56 py-1 rounded-lg text-sm shadow-xl/30 bg-color-background border border-color-border" cdkMenu>
    @for (item of this.contextMenu; track item) {
      <button
        cdkMenuItem
        (click)="item.action(this.contextMenuPosition()!)"
        [disabled]="item.disabled?.() ?? false"
        [class.hidden]="!(item.visible?.() ?? true)"
        class="w-full px-4 py-1.5 text-start not-disabled:cursor-pointer focus:outline-0 hover:not-disabled:bg-color-background-hover hover:not-disabled:text-color-text-hover disabled:text-color-disabled">
        {{ item.text }}
      </button>
    }
  </div>
</ng-template>
